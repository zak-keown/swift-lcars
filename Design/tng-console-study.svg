<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
<title id="title">Swift LCARS — TNG console geometry study</title>
<desc id="description">Flat peach, mauve and lavender LCARS rails around a stellar cartography console. This is an original static design study with illustrative data, not a production screen or working app.</desc>
