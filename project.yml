name: LCARSCatalog
options:
  bundleIdPrefix: com.zakkeown.swiftlcars
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  SwiftLCARS:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CatalogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Examples/UITests
    dependencies:
      - target: LCARSCatalog-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakkeown.swiftlcars.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LCARSCatalog-iOS
  LCARSCatalog-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/LCARSCatalog
      - Examples/Assets.xcassets
    dependencies:
      - package: SwiftLCARS
        product: SwiftLCARS
      - target: LCARSActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakkeown.swiftlcars.catalog
        PRODUCT_NAME: LCARSCatalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Examples/iOS/Info.plist
      properties:
        CFBundleDisplayName: LCARS Catalog
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.zakkeown.swiftlcars.themes
            CFBundleURLSchemes: [swiftlcars]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LCARSActivity:
    type: app-extension
    platform: iOS
    sources:
      - Examples/LiveActivity
      - Sources/LCARSCatalog/LCARSActivityAttributes.swift
    dependencies:
      - package: SwiftLCARS
        product: SwiftLCARS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakkeown.swiftlcars.catalog.activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Examples/LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: LCARS Franchise
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LCARSCatalog-macOS:
    type: application
    platform: macOS
    sources:
      - Sources/LCARSCatalog
      - Examples/Assets.xcassets
    dependencies:
      - package: SwiftLCARS
        product: SwiftLCARS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakkeown.swiftlcars.catalog.mac
        PRODUCT_NAME: LCARSCatalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Examples/macOS/Info.plist
      properties:
        CFBundleDisplayName: LCARS Catalog
        LSApplicationCategoryType: public.app-category.developer-tools
schemes:
  LCARSCatalog-iOS:
    build:
      targets:
        LCARSCatalog-iOS: all
        CatalogUITests: [test]
    test:
      targets:
        - CatalogUITests
      gatherCoverageData: false
    run:
      config: Debug
  LCARSCatalog-macOS:
    build:
      targets:
        LCARSCatalog-macOS: all
    run:
      config: Debug
